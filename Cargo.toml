[package]
name = "artisan_middleware"
version = "7.1.0"
edition = "2021"
authors = [
    "Artisan Hosting",
    "Darrion Whitfield <dwhitfield@ramfield.net>"
]
description = "The main services of the artisan platform to allow communication and management of linux system services"
homepage = "https://docs.artisanhosting.net"
license = "MIT OR Apache-2.0"

[features]
default = []
cli = []

[dev-dependencies]
mockall = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies]
dusa_collection_utils = "^4.0.2"
# Asynchronous runtime
tokio = { version = "1", features = ["full"] }
colored = "3.1.1"
colorized = "1.0.0"
chrono = "0.4.38"
aes-gcm = "0.11.1"
base64 = "0.23.1"
hex = "0.4.3"
rand = "0.10.2"
lz4 = "1.28.1"
toml = "1.1.6"
config = "0.15.25"
# Per-app runtime bundle format (config + secrets), see `runtime_bundle`
acai_core = "1.0.1"
tempfile = "3.5"

# Serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pem = "4.0.0"

# Resource taxonomy ID types (OrganizationId, InstanceId, SessionId)
uuid = { version = "1", features = ["v4"] }

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18.0"
users = "0.11.0"
walkdir = "2.5.0"
lazy_static = "1.5.0"
sysinfo = "0.39.6"
gethostname = "1.1.0"
reqwest = "0.13.5"
trust-dns-resolver = "0.23.2"
bytes = "1.10.1"
simple_comms = "2.0.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.159"
systemctl = "0.3.1"
tokio-uds = "0.2"
nix = { version = "0.31.3", features = ["process"] }